apply from: 'download.gradle'

static def releaseTime() {
    return new Date().format("yy.MMddHH", TimeZone.getTimeZone("GMT+8"))
}

def name = "hunreader"
def version = "3." + releaseTime()
def gitOutput = new ByteArrayOutputStream()
def gitError = new ByteArrayOutputStream()
def gitProcess = ["git", "rev-list", "HEAD", "--count"].execute(null, rootDir)
gitProcess.waitForProcessOutput(gitOutput, gitError)
if (gitProcess.exitValue() != 0) {
    throw new GradleException("Unable to determine the Git commit count: ${gitError.toString("UTF-8").trim()}")
}
def gitCommitCount = gitOutput.toString("UTF-8").trim()
if (!(gitCommitCount ==~ /\d+/)) {
    throw new GradleException("Git returned an invalid commit count: '${gitCommitCount}'")
}
def gitCommits = Integer.parseInt(gitCommitCount)

def signingPropertiesFile = file(System.getenv("HUNREADER_SIGNING_PROPERTIES")
        ?: "${System.getProperty('user.home')}/.hunreader/signing.properties")
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withReader("UTF-8") { signingProperties.load(it) }
    ["storeFile", "storePassword", "keyAlias", "keyPassword"].each { key ->
        if (!signingProperties.getProperty(key)?.trim()) {
            throw new GradleException("Missing ${key} in HunReader signing properties.")
        }
    }
}

def validateHunReaderSigning = tasks.register("validateHunReaderSigning") {
    doLast {
        if (!signingPropertiesFile.isFile()) {
            throw new GradleException("HunReader release signing is not configured. "
                    + "Run scripts/New-HunReaderSigningKey.ps1 or set HUNREADER_SIGNING_PROPERTIES. "
                    + "Debug builds do not need the release key.")
        }
    }
}
tasks.configureEach { task ->
    if (task.name == "preAppReleaseBuild") {
        dependsOn validateHunReaderSigning
    }
}

android {
    compileSdk = compile_sdk_version
    namespace = 'io.legado.app'
    kotlin {
        jvmToolchain {
            languageVersion.set(JavaLanguageVersion.of(17))
        }
    }

    signingConfigs {
        if (signingPropertiesFile.isFile()) {
            hunreader {
                storeFile file(signingProperties.getProperty("storeFile"))
                storePassword signingProperties.getProperty("storePassword")
                keyAlias signingProperties.getProperty("keyAlias")
                keyPassword signingProperties.getProperty("keyPassword")
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }
    defaultConfig {
        applicationId "io.github.hunterxue.hunreader"
        manifestPlaceholders.put("app_name", "@string/app_name")
        manifestPlaceholders.put("import_scheme", "hunreader")
        minSdk 21
        targetSdk 36
        versionCode 10000 + gitCommits
        versionName version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        project.ext.set("archivesBaseName", name + "_" + version)

        buildConfigField "String", "Cronet_Version", "\"$CronetVersion\""
        buildConfigField "String", "Cronet_Main_Version", "\"$CronetMainVersion\""

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.incremental"     : "true",
                        "room.expandProjection": "true",
                        "room.schemaLocation"  : "$projectDir/schemas".toString()
                ]
            }
        }
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
    buildTypes {
        release {
            if (signingPropertiesFile.isFile()) {
                signingConfig signingConfigs.hunreader
            }

            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'cronet-proguard-rules.pro'
        }
        debug {
            manifestPlaceholders.put("app_name", "@string/app_name_debug")
            manifestPlaceholders.put("import_scheme", "hunreader-debug")

            applicationIdSuffix '.debug'
            versionNameSuffix 'debug'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'cronet-proguard-rules.pro'
        }
    }
    //noinspection GrDeprecatedAPIUsage
    flavorDimensions = ['mode']
    productFlavors {
        app {
            dimension "mode"
        }
    }

    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            def flavor = variant.productFlavors[0].name
            outputFileName = "${name}_${flavor}_${variant.buildType.name}_${defaultConfig.versionName}.apk"
        }
    }


    room {
        schemaDirectory "$projectDir/schemas"
    }
    // 设定Room的KSP参数
    ksp {
        arg("room.incremental", "true")
        arg("room.expandProjection", "true")
        arg("room.generateKotlin", "false")
        //arg("room.schemaLocation", "$projectDir/schemas")

    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled = true
        // Sets Java compatibility
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources.excludes.add('META-INF/*')
        jniLibs.excludes.add('lib/*/librtmp-jni.so')
    }

    sourceSets {
        // Adds exported schema location as test app assets.
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
    lint {
        checkDependencies = true
    }
    tasks.withType(JavaCompile).tap {
        configureEach {
            //options.compilerArgs << "-Xlint:unchecked"
        }
    }
    lint { //忽略string翻译缺失，后面需要翻译时去掉，todo
        disable 'MissingTranslation'
    }
}

